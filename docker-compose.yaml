version: "3.8"
services:
  runner:
    user: "1001:1001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    build:
      dockerfile: Dockerfile
      context: .
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        NO_PROXY: ""
    restart: always
    env_file: .env
    environment:
      - DOCKER_GID=999
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: "1"
          memory: 4G
        reservations:
          cpus: "0.9"
          memory: 2G


