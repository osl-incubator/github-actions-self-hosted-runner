version: "3.8"
services:
  runner:
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    build:
      dockerfile: Dockerfile
      context: .
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        NO_PROXY: ""
        DOCKER_GID: ${DOCKER_GID:-999}
    restart: always
    env_file: .env
    environment:
      DOCKER_GID: ${DOCKER_GID}
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: "1"
          memory: 4G
        reservations:
          cpus: "0.9"
          memory: 2G


